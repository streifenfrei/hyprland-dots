# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock/mountains_lock.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgb(86, 64, 83)
    font_size = 80
    font_family = JetBrains Mono Nerd
    position = 210, 210
    halign = left
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d, %Y")"
    color = rgb(86, 64, 83)
    font_size = 30
    font_family = JetBrains Mono Nerd
    position = 130, 110
    halign = left
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 400, 40
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(86, 64, 83)
    inner_color = rgba(255, 255, 255, 0.1)
    border_size = 1
    fade_on_empty = false
    font_family = JetBrains Mono Nerd
    placeholder_text = <span foreground="##ab9eaaff">Enter Password</span>
    color =#ab9eaa
    hide_input = false
    position = 170, -100
    halign = left
    valign = center
}

# LAYOUT
label {
  monitor =
  text = 󰌌   $LAYOUT
  color = rgb(86, 64, 83)
  font_size = 12
  font_family = JetBrains Mono Nerd
  position = 10, 10
  halign = left
  valign = bottom
}